name: Build CI

on:
  workflow_dispatch:
  push:
    branches: [module, main]
    paths:
      - module/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - module/**
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: module

    steps:
      - name: Checkout Comet module
        uses: actions/checkout@v4
        with:
          path: comet

      - name: Verify supplied AkiAppOpt binaries
        shell: bash
        working-directory: comet
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "$MODULE_DIR/bin/$abi/AppOpt"
            chmod 0755 "$MODULE_DIR/bin/$abi/AppOpt"
          done
          (cd "$MODULE_DIR/bin" && sha256sum --check --strict SHA256SUMS)

      - name: Check module shell syntax
        shell: bash
        working-directory: comet
        run: |
          set -euo pipefail
          for script in "$MODULE_DIR"/*.sh "$MODULE_DIR/META-INF/com/google/android/update-binary"; do
            sh -n "$script"
          done

      - name: Package module
        id: package
        shell: bash
        working-directory: comet
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' "$MODULE_DIR/module.prop" | head -n1)"
          artifact="${version}.zip"
          cp LICENSE "$MODULE_DIR/LICENSE"
          chmod 0755 "$MODULE_DIR"/*.sh
          chmod 0755 "$MODULE_DIR/META-INF/com/google/android/update-binary"
          (cd "$MODULE_DIR" && zip -r -9 "../$artifact" . -x 'AppOpt.c')
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: comet/${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14
